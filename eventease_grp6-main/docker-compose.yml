
services:
  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: eventease-server
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      # MongoDB Atlas connection string (set in .env on your EC2)
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-eventease}
      # JWT secret (change in production)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # Frontend URL used for CORS and for Stripe success/cancel redirects.
      # This MUST be the public origin or buyers are returned to the wrong host.
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      SEAT_HOLD_MINUTES: ${SEAT_HOLD_MINUTES:-10}
      # Stripe keys (optional - set in .env if using Stripe).
      # STRIPE_WEBHOOK_SECRET is what confirms paid bookings server-side; without
      # it a booking only confirms if the buyer's browser returns successfully.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Email configuration (optional - set in .env if using email)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-}
      # OpenTelemetry zero-code instrumentation for the Node.js backend
      NODE_OPTIONS: "--require @opentelemetry/auto-instrumentations-node/register"
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-eventease-backend}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-service.namespace=eventease,deployment.environment=production}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS}
      # Grafana Cloud Profiles (Pyroscope)
      PYROSCOPE_SERVER_ADDRESS: ${PYROSCOPE_SERVER_ADDRESS:-}
      PYROSCOPE_BASIC_AUTH_USER: ${PYROSCOPE_BASIC_AUTH_USER:-}
      PYROSCOPE_BASIC_AUTH_PASSWORD: ${PYROSCOPE_BASIC_AUTH_PASSWORD:-}
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - eventease-network
    restart: unless-stopped
    # Wait for 10 seconds to give time for initial startup
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend React App
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    container_name: eventease-client
    environment:
      # Backend API URL (set in .env on your EC2)
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - eventease-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Production HTTPS entry point. This profile is enabled by deployment while
  # local development continues to use localhost:3000.
  caddy:
    image: caddy:2-alpine
    container_name: eventease-caddy
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      client:
        condition: service_healthy
    networks:
      - eventease-network
    restart: unless-stopped

networks:
  eventease-network:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
