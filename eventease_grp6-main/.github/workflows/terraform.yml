name: Terraform

on:
  push:
    branches: [uat]
    paths:
      - 'infra/uat/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Plan only, or create/update UAT
        type: choice
        options: [plan, apply]
        default: plan
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: eventease-terraform-uat
  cancel-in-progress: false

jobs:
  terraform:
    name: UAT infrastructure
    if: github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/uat
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::406658519411:role/EventEaseTerraformRole
          aws-region: ap-southeast-1
          allowed-account-ids: '406658519411'

      - name: Check formatting
        run: terraform fmt -check

      - name: Initialise state backend
        run: terraform init -lockfile=readonly -backend-config="bucket=eventease-terraform-state-406658519411-ap-southeast-1"

      - name: Validate configuration
        run: terraform validate

      - name: Plan UAT infrastructure
        run: terraform plan -lock-timeout=5m -out=uat.tfplan

      - name: Apply UAT infrastructure
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform apply -lock-timeout=5m uat.tfplan

      - name: Show UAT details
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply'
        run: terraform output
